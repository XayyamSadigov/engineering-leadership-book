[project]
name = "engineering-leadership-book"
version = "0.1.0"
description = "Build and validation tooling for The Engineering Leadership Handbook"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
