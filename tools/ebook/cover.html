<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  @font-face { font-family: "Plex Serif"; src: url("{{fonts}}/IBMPlexSerif-Regular.ttf"); }
  @font-face { font-family: "Plex Serif"; font-weight: 600; src: url("{{fonts}}/IBMPlexSerif-SemiBold.ttf"); }
  @font-face { font-family: "Plex Cond"; src: url("{{fonts}}/IBMPlexSansCondensed-Regular.ttf"); }
  @font-face { font-family: "Plex Cond"; font-weight: 600; src: url("{{fonts}}/IBMPlexSansCondensed-SemiBold.ttf"); }
  html, body { margin: 0; width: 800px; height: 1200px; }
  body {
    background: #23394d; color: #f4f6f8; box-sizing: border-box;
    padding: 96px 72px 80px; display: flex; flex-direction: column;
    font-family: "Plex Serif", Georgia, serif;
  }
  /* The ladder: one rung per level the book climbs, from senior engineer to CTO. */
  .ladder { display: flex; flex-direction: column-reverse; gap: 14px; margin-bottom: 72px; }
  .rung { height: 10px; background: #e0a43a; border-radius: 1px; }
  .rung:nth-child(1) { width: 22%; opacity: .45; }
  .rung:nth-child(2) { width: 38%; opacity: .6; }
  .rung:nth-child(3) { width: 54%; opacity: .72; }
  .rung:nth-child(4) { width: 70%; opacity: .86; }
  .rung:nth-child(5) { width: 86%; }
  h1 { font-weight: 600; font-size: 76px; line-height: 1.04; margin: 0 0 36px; letter-spacing: -0.01em; }
  .sub { font-family: "Plex Cond", "Arial Narrow", sans-serif; font-size: 31px; line-height: 1.3; color: #c9d6e2; margin: 0; max-width: 600px; }
  .author { margin-top: auto; font-family: "Plex Cond", "Arial Narrow", sans-serif; font-size: 26px; color: #e0a43a; }
</style>
</head>
<body>
  <div class="ladder"><div class="rung"></div><div class="rung"></div><div class="rung"></div><div class="rung"></div><div class="rung"></div></div>
  <h1>{{title}}</h1>
  <p class="sub">{{subtitle}}</p>
  <p class="author">{{author}}</p>
</body>
</html>
