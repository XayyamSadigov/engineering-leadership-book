# Part summaries, keyed by Roman numeral (curriculum.yaml has the English).
parts:
  I: Что это за работа, как устроен управленческий рычаг и как работа меняется на каждом уровне.
  II: Ремесло работы с людьми — встречи один на один, обратная связь, найм, развитие, результативность и удержание.
  III: Команда как единица поставки — безопасность, подотчётность, договорённости, решения и здоровье команды.
  IV: Как превратить намерение в поставленное изменение — планирование, поток, предсказуемость и измерение.
  V: Самая глубокая часть книги — что такое качество, кто за него отвечает, как оно деградирует и как вернуть его в масштабе.
  VI: Кто определяет техническое направление, как и по каким правилам.
  VII: Структура как проектное решение с предсказуемыми последствиями для архитектуры и потока.
  VIII: Повторяющиеся механизмы, которые делают организацию управляемой, — ритмы, карты показателей, обзоры и эскалация.
  IX: Руководство через руководителей — организация на 50–150 инженеров.
  X: Экономический и продуктовый контекст, которому служат инженерные решения.
  XI: Руководство всей инженерной функцией — директора, ресурсы, корпоративное управление и многолетние изменения.
  XII: Технологии как забота всей компании — стратегия, капитал, риски и совет директоров.
  XIII: Ситуации, в которых стандартной практики недостаточно.
  XV: Десять этапов в Northstar Technologies — сначала в роли директора по разработке, затем CTO.
