site_name: The Engineering Leadership Handbook
site_description: >-
  An open-source, evidence-informed textbook on building, leading, scaling, and transforming
  software engineering organizations, from senior engineer to CTO.
site_url: https://xayyamsadigov.github.io/engineering-leadership-book/
repo_url: https://github.com/XayyamSadigov/engineering-leadership-book
repo_name: XayyamSadigov/engineering-leadership-book
edit_uri: edit/main/docs/
docs_dir: docs
# MkDocs always excludes /templates/; re-include it, since the template library lives there.
exclude_docs: |
  !/templates/
copyright: Text CC BY 4.0 · Code MIT · Northstar Technologies is fictional

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  # Russian edition: page.ru.md beside page.md, served under /ru/. Pages without a .ru.md fall back
  # to English. Russian terminology: research/translation-ru-glossary.md.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: Руководство по инженерному лидерству
          site_description: >-
            Открытый учебник, опирающийся на исследования, о том, как строить, вести, масштабировать
            и трансформировать инженерные организации: от senior-инженера до CTO.
          copyright: Текст CC BY 4.0 · Код MIT · Northstar Technologies — вымышленная компания
