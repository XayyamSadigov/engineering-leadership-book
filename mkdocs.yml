site_name: The Engineering Leadership Handbook
site_description: >-
  An open-source, evidence-informed textbook on building, leading, scaling, and transforming
  software engineering organizations, from senior engineer to CTO.
site_url: https://xayyamsadigov.github.io/engineering-leadership-handbook/
repo_url: https://github.com/XayyamSadigov/engineering-leadership-handbook
repo_name: XayyamSadigov/engineering-leadership-handbook
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Text CC BY 4.0 · Code MIT · Northstar Technologies is fictional

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Only published chapters and templates are listed here. tools/check_navigation.py enforces it
# against curriculum.yaml. The single-file edition follows this order.
