  claims:
  - text: The review finds that expert judgment is the most frequently used estimation strategy for software
      projects, that there is no substantial evidence in favor of estimation models, and that in some
      situations expert estimates can be expected to be more accurate than formal models.
    basis: full-text
  - text: 'It evaluates twelve guidelines for expert estimation, including: avoid conflicting estimation
      goals, use documented data from previous tasks, combine estimates from different experts and strategies,
      assess the uncertainty of the estimate, and provide feedback on estimation accuracy; it reports
      supporting evidence for all twelve.'
    basis: full-text
  - text: The review reports that 'bid', 'planned effort', and 'most likely effort' were frequently not
      distinguished in practice although they serve conflicting goals, and argues (from human-judgment
      studies, not software studies) that mixing them reduces the realism of estimates.
    basis: full-text
  - text: Citing earlier studies, the review reports that unaided expert prediction intervals are too
      narrow; in one study of industrial software projects, hit rates of effort intervals were all below
      50 percent, and students' 90 percent intervals contained the actual value about 60 percent of the
      time.
    basis: full-text
  - text: The review refers to over-optimism in predicting one's own performance as the 'planning fallacy',
      crediting the term to Kahneman and Tversky (1979).
    basis: full-text
  - text: It recommends assessing uncertainty with prediction intervals, and describes a process in which
      minimum and maximum are set as fixed proportions of the most likely estimate before the confidence
      level is judged, reported to improve the match between confidence and hit rate.
    basis: full-text
  caveats: A 2004 narrative review; several guidelines rest on general human-judgment research rather
    than software studies, which the author states. Read from the author's preprint on the Simula site;
    page layout and minor wording may differ from the published version. OpenAlex dates online publication
    to 2003; the issue is 2004.
