- id: schwartz2020style
  type: web-guide
  title: Style Guides and Rules (Software Engineering at Google, Chapter 8)
  authors:
  - Shaindel Schwartz
  year: 2020
  venue: 'Software Engineering at Google: Lessons Learned from Programming Over Time (O''Reilly Media),
    free online edition at abseil.io'
  url: https://abseil.io/resources/swe-book/html/ch08.html
  evidence_class: practitioner
