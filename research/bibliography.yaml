  - https://projectproduction.org/journal/reprint-littles-law-as-viewed-on-its-50th-anniversary/
  verified_on: '2026-11-19'
  claims:
  - text: L = λW relates three averages (items in system, arrival rate, time in system) and holds under
      very general conditions, independent of queue discipline.
    basis: full text
  - text: Over a finite time window, in particular one where the system is empty at start and end, the
      relationship holds exactly for the measured data; the author frames finite-window use as measurement
      rather than forecasting.
    basis: full text
  - text: In operations management the law is commonly written as throughput = work in process / cycle
      time; the law does not by itself tell managers how to handle trade-offs.
