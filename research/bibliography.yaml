- id: meadows1999leverage
  type: report
  title: 'Leverage Points: Places to Intervene in a System'
  authors:
  - Donella H. Meadows
  year: 1999
  publisher: The Sustainability Institute
  venue: The Sustainability Institute, Hartland, Vermont (report; a shorter version appeared in Whole
    Earth, winter 1997)
  url: https://donellameadows.org/archives/leverage-points-places-to-intervene-in-a-system/
  evidence_class: practitioner
  access_level: full-text
  verified_fields:
  - title
  - authors
  - year
  - publisher
  - venue
  - url
  verified_via:
  - https://donellameadows.org/archives/leverage-points-places-to-intervene-in-a-system/
  - https://donellameadows.org/wp-content/userfiles/Leverage_Points.pdf
  verified_on: '2026-11-19'
  claims:
  - text: Lists twelve places to intervene in a system in increasing order of effectiveness, from constants,
      parameters, and numbers at the bottom, through buffers, stock-and-flow structure, delays, the strength
      of balancing loops, the gain of reinforcing loops, information flows, rules, and the power to self-organize,
      to goals, paradigms, and the power to transcend paradigms at the top.
    basis: full-text
  - text: Says most attention goes to parameters, which rarely change behavior.
    basis: full-text
  - text: Says delays that are long relative to the rate of change in the system cause overshoot and oscillation.
    basis: full-text
  - text: Says reducing the gain around a reinforcing (positive) loop is usually a more powerful leverage
      point than strengthening balancing (negative) loops.
    basis: full-text
  - text: Says missing feedback is a common cause of system malfunction and that adding or restoring information
      can be a powerful intervention, usually easier and cheaper than rebuilding physical infrastructure.
    basis: full-text
  - text: Relates Jay Forrester's observation that people often find a leverage point intuitively but
      push it in the wrong direction, and calls leverage points counterintuitive.
    basis: full-text
  - text: Calls the list tentative, with an order that can shift, and says the higher the leverage point,
      the more the system will resist changing it.
    basis: full-text
  caveats: An essay by a systems scientist, not an empirical study; its examples are from economics, ecology,
    and public policy, not software organizations. Mapping the levels to engineering management is this
    book's interpretation. The PDF (title page "Published by The Sustainability Institute, 1999"; running
    footer "Sustainability Institute, December, 1999") was text-extracted in session; the web page shows
    no date.
  access_notes: Full text read from the Donella Meadows Project / Academy for Systems Change site (web
    page and the PDF it links). Copyrighted; summarize, do not quote at length.
- id: repenning2001nobody
  type: journal-article
  title: 'Nobody Ever Gets Credit for Fixing Problems that Never Happened: Creating and Sustaining Process
    Improvement'
  authors:
  - Nelson P. Repenning
  - John D. Sterman
  year: 2001
  venue: California Management Review 43(4), pp. 64-88
  doi: 10.2307/41166101
  url: https://web.mit.edu/nelsonr/www/CMR_Getting_Quality_v1.0.html
  evidence_class: scholarly
  access_level: full-text
  verified_fields:
  - title
  - authors
  - year
  - venue
  - doi
  - url
  verified_via:
  - https://web.mit.edu/nelsonr/www/CMR_Getting_Quality_v1.0.html
  - https://web.mit.edu/nelsonr/www/Repenning=Sterman_CMR_su01_.pdf
  - https://api.crossref.org/works/10.2307/41166101
  verified_on: '2026-11-19'
  claims:
  - text: Based on over a dozen in-depth case studies of improvement programs in industries including
      telecommunications, semiconductors, chemicals, oil, automobiles, and recreational products, complemented
      by system dynamics models.
    basis: full-text
  - text: Describes two ways to close a performance gap, working harder (more time on production, a balancing
      loop) and working smarter (time on improvement, a balancing loop with a delay before benefits).
    basis: full-text
  - text: Shows that increasing time on improvement lowers output in the short run and raises it permanently
      later, a worse-before-better dynamic.
    basis: full-text
  - text: Describes the capability trap, in which cutting improvement time to meet immediate throughput
      erodes capability and forces still more reliance on working harder (a reinforcing reinvestment loop
      running as a vicious cycle).
    basis: full-text
  - text: Argues that because the link between skipped improvement and later shortfall is long and hard
      to observe, managers tend to attribute low performance to worker effort or discipline (the fundamental
      attribution error) and respond with more pressure.
    basis: full-text
  caveats: Qualitative field studies and simulation models, not controlled experiments; the cases are
    mostly manufacturing and product development, not software operations.
  access_notes: Full text read from the PDF on Nelson Repenning's MIT page (author-hosted). Bibliographic
    data confirmed with Crossref.
