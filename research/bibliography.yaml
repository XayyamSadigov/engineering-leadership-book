  - year
  - publisher
  - url
  verified_via:
  - https://how.complexsystems.fail/
  verified_on: '2026-11-19'
  claims:
  - text: Overt failure in complex systems requires several small failures to combine; each is necessary
      but only their combination is sufficient.
    basis: full-text
  - text: Complex systems always contain latent failures and run in a degraded mode; reviews after accidents
      usually find earlier near misses.
    basis: full-text
  - text: Attributing an accident to a single root cause is argued to be wrong, because there are multiple
      jointly sufficient contributors; root-cause evaluations are said to reflect a social need to blame
      rather than a technical understanding of failure.
    basis: full-text
  - text: Hindsight bias is described as the primary obstacle to accident investigation, because knowledge
      of the outcome makes earlier signals look more salient than they were.
    basis: full-text
  - text: Post-accident remedies aimed at the person or step nearest the failure ('end-of-the-chain' measures)
      are argued to do little to prevent further accidents and often add coupling and complexity.
    basis: full-text
  caveats: A short treatise by a physician and safety researcher, written about healthcare and other hazardous
    domains; it is reasoned argument drawn from research, not an empirical study, and is not peer reviewed.
    Copyright line on the page reads 1998, 1999, 2000 (revised versions); the year recorded is the original.
  access_notes: The full text on how.complexsystems.fail was read in session (curl, text extracted). An
