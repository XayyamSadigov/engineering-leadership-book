  - year
  - venue
  - url
  - archive_url
  verified_via:
  - https://archive.org/wayback/available?url=primevideotech.com/video-streaming/scaling-up-the-prime-video-audio-video-monitoring-service-and-reducing-costs-by-90&timestamp=20230401
  - https://web.archive.org/web/20230323220106id_/https://www.primevideotech.com/video-streaming/scaling-up-the-prime-video-audio-video-monitoring-service-and-reducing-costs-by-90
  verified_on: '2026-11-19'
  claims:
  - text: The post describes one service, Prime Video's tool for monitoring the audio/video quality of
      the live streams customers view, built by its Video Quality Analysis team; the service has three
      components (media converter, defect detectors, orchestration).
    basis: full-text
  - text: The first version was a distributed design on serverless components (AWS Step Functions orchestration,
      AWS Lambda, video frames passed through an S3 bucket). The authors call it a good choice for building
      quickly, but it hit a hard scaling limit at around 5 percent of the expected load, the orchestration
      reached account limits because of many state transitions per second of stream, and per-transition
      and S3 call costs were too high at scale.
    basis: full-text
  - text: The team moved all components into a single process on Amazon ECS and EC2, keeping data transfer
      in memory; the components themselves stayed the same, which let them reuse much of the code. Detectors
      now scale only vertically, so the service is cloned and each copy runs a subset of detectors behind
      a lightweight orchestration layer.
    basis: full-text
  - text: The post reports that the move reduced infrastructure cost by over 90 percent and increased
      scaling capability, and states that whether to use microservices and serverless components or a
      monolith has to be decided case by case.
    basis: full-text
  caveats: A first-hand account of one service, self-reported, with no published method for the cost figure.
    The subtitle on the page frames it as a move "from a distributed microservices architecture to a monolith
    application"; the scope is one monitoring service, not Prime Video's architecture, and the post does
    not claim Amazon or Prime Video abandoned microservices. Read from a Wayback Machine capture dated
    2023-03-23 of the original URL; the post itself is dated Mar 22, 2023 on the page.
