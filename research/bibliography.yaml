  - https://spsp.org/news-center/blog/buehler-planning-fallacy
  verified_on: '2026-11-20'
  claims:
  - text: Across five studies, people's predictions of when they would finish academic and nonacademic
      tasks were overly optimistic; they underestimated their own completion times but not those of others.
    basis: abstract
  - text: When predicting, people focused on plan-based scenarios for the task at hand rather than on
      relevant past experience; instructing them to connect the prediction to past experience eliminated
      the optimistic bias in the study.
    basis: abstract
  - text: People attributed past prediction failures to external, transient, and specific causes, which
      reduced the perceived relevance of that past experience; observers predicting others' completion
      times relied more on past experience and overestimated rather than underestimated.
    basis: abstract
  caveats: Studies of individuals' own academic and nonacademic tasks (participant details not read),
    not software teams or organizational commitments. Abstract only; effect sizes and the specific tasks
    were not read, so no numbers are cited. The term 'planning fallacy' is credited to Kahneman and Tversky
