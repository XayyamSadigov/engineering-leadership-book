  verified_on: '2026-11-19'
  claims:
  - text: Canarying is a partial, time-limited deployment of a change to a subset of a service, followed
      by an evaluation that decides whether the rollout proceeds; the rest of the service serves as the
      control.
    basis: full-text
  - text: Canary metrics must be broken down by population, because an aggregate figure can hide a serious
      problem in a small canary.
