  claims:
  - text: Using microdata on the performance of sales workers at 131 firms (published QJE abstract; the
      2018 NBER working paper w24343 reports 214 firms), the study finds evidence consistent with the
      Peter Principle, firms placing heavy weight on current job performance in promotion decisions even
      though other characteristics better predict performance as a manager.
