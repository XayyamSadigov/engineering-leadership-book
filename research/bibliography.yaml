  - url
  verified_via:
  - https://abseil.io/resources/swe-book/html/ch08.html
  verified_on: '2026-11-19'
  claims:
  - text: The chapter distinguishes rules (mandatory, set aside only through approved exceptions) from
      guidance (recommended practice that leaves room for judgment).
    basis: full-text
  - text: Its stated principles for rules include that each rule must pull its weight (rules have a learning
      and maintenance cost, so the set is kept small), optimizing for the reader, consistency, avoiding
      error-prone constructs, and conceding to practicalities such as performance or interoperability.
    basis: full-text
  - text: Rules are revisited when they become outdated, when engineers routinely work around them, or
      when enforcement becomes burdensome; proposals must show a real problem in existing code, are discussed
      openly, and are decided by a small group of senior language experts (style arbiters).
    basis: full-text
  - text: Exceptions are granted rarely, when the benefit clearly outweighs the rule; requests based on
      preference are refused, and frequent requests can signal that a rule needs revisiting.
    basis: full-text
  - text: The chapter prefers technical enforcement (formatters run as presubmit checks, error checkers)
      over human enforcement where possible, and acknowledges that some rules need human judgment and
      are enforced socially, for example through code review.
    basis: full-text
  caveats: Describes one very large organization's practice for language style guides; no outcome data.
    CC BY-NC-ND 4.0, summarize only. Year is the book's publication year (2020). Edited by Tom Manshreck
    per the chapter page. The chapter also gives an estimate of the share of C++ style rules that could
    be checked automatically; that figure is not used in this book.
  access_notes: Free online chapter, read in full on 2026-11-19.
