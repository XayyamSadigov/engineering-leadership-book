  claims:
  - text: The essay contrasts a traditional view of human error, which focuses on the individuals involved
      (attributed to Sidney Dekker as the "Bad Apple Theory"), with a view of mistakes as an opportunity
      for learning, and describes blameless postmortems as part of the second.
    basis: full-text
  - text: A blameless postmortem lets engineers whose actions contributed to an accident give a detailed
      account of what they did, what they observed, what they expected and assumed, and their understanding
      of the timeline, without fear of punishment.
