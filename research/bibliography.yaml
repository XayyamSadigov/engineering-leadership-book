      (2003), takes the 'outside view' by placing a project in the distribution of outcomes of comparable
      past projects instead of forecasting the specific events that will affect it.
    basis: full-text
  - text: 'The method has three steps: identify a reference class of past similar projects (broad enough
      to be statistically meaningful, narrow enough to be comparable), establish a probability distribution
      for that class from credible data, and compare the specific project with that distribution.'
    basis: full-text
  - text: The paper reports the first practical application, by the UK Department for Transport and HM
      Treasury from 2004, using empirically based 'optimism bias uplifts' for reference classes of transport
      projects; the required uplift rises as the accepted risk of overrun falls (for road projects, 15
      percent at a 50 percent accepted risk and 45 percent at 10 percent).
    basis: full-text
  caveats: Evidence base is large public transport infrastructure, not software. The author's own data
    and method; later critiques of Flyvbjerg's overrun statistics exist and were not reviewed here. Read
    from the author-posted arXiv version, which states the journal reference.
  access_notes: arXiv abstract page and PDF fetched; text extracted from the PDF. Publisher DOI not confirmed
    on a fetched page, so none is recorded.
