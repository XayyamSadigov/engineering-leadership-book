  claims:
  - text: The article defines an "effective false positive" as an issue on which developers took no positive
      action after seeing it, so that developer perception, not tool correctness, decides.
    basis: full-text
  - text: Early FindBugs integrations failed at Google. A nightly bug dashboard saw little use because
      it was outside developers' workflow. In a 2009 company-wide fix-it week, 3,954 warnings were reviewed
      and only 640 (16 percent) were fixed. A code-review integration was discontinued in 2011 because
      effective false positives cost developer trust and per-developer customization produced inconsistent
      views.
    basis: full-text
  - text: Checks enabled as compiler errors must be easily understood, actionable, produce no effective
      false positives, and concern correctness rather than style; the authors report that developers ignored
      compiler warnings, so checks were made errors after existing instances were cleaned up.
    basis: full-text
  - text: Checks shown in code review may have up to 10 percent effective false positives; a "Not useful"
      button files a bug to the analyzer's owners, and an analyzer whose not-useful ratio goes above 10
      percent is disabled until improved.
    basis: full-text
  - text: Configuration is allowed at project level rather than per user, because per-user customization
      had produced inconsistent views and backsliding.
    basis: full-text
  caveats: Experience report from one company by the tool builders, published in CACM's contributed articles
    section; not a controlled study. The 10 percent threshold is described in the article as initially
    chosen somewhat arbitrarily. Read via a course-hosted copy of the published PDF (masthead, DOI and
    authors match the Google Research page); cacm.acm.org returned 403.
  access_notes: Full text is openly hosted by Google Research (Download link on the publication page,
