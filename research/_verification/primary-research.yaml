- id: dora2026software
  type: web-guide
  title: "DORA's software delivery performance metrics"
  authors: ["DORA (Google Cloud)"]
  year: 2026
  venue: "dora.dev guides"
  doi: null
  url: "https://dora.dev/guides/dora-metrics/"
  evidence_class: industry-research
  access_level: full-text
  verified_fields: [title, authors, year, venue, url]
  verified_via: ["https://dora.dev/guides/dora-metrics-four-keys/", "https://dora.dev/guides/dora-metrics/"]
  claims:
    - text: "The current guide (last updated January 5, 2026) lists five software delivery performance metrics, not four: change lead time, deployment frequency, failed deployment recovery time, change fail rate, and deployment rework rate."
      basis: full-text
    - text: "The guide groups the metrics into two factors. Throughput: change lead time, deployment frequency, failed deployment recovery time. Instability: change fail rate, deployment rework rate."
      basis: full-text
    - text: "Change lead time is defined as the time for a change to go from committed to version control to deployed in production; change fail rate as the ratio of deployments that require immediate intervention after deployment; deployment rework rate as the ratio of deployments that are unplanned and happen as a result of a production incident."
      basis: full-text
  caveats: "Date-sensitive. The metric set and grouping have changed over time (the 'four keys' name survives only in the old URL slug). Failed deployment recovery time sits under throughput, not stability, in this version. Re-check the page before publication."
  access_notes: "The old URL /guides/dora-metrics-four-keys/ returns a redirect (1 hop) to /guides/dora-metrics/, confirmed with a HEAD request. Page shows 'Last updated: January 5, 2026'."

